<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Patrón de azulejos que se repite como fondo de todas las páginas.
       Son 4 azulejos de 80px con dos motivos alternados.
       Para cambiar el tono, edita los colores de aquí abajo. -->
  <rect width="160" height="160" fill="#F7F1E3"/>

  <!-- Líneas de junta entre azulejos -->
  <g stroke="#EADFC8" stroke-width="1.4">
    <path d="M80 0V160M0 80H160"/>
  </g>

  <g fill="#EFE5D0">
    <!-- Motivo A: cuatrifolio (arriba izquierda y abajo derecha) -->
    <g>
      <circle cx="26" cy="40" r="13"/>
      <circle cx="54" cy="40" r="13"/>
      <circle cx="40" cy="26" r="13"/>
      <circle cx="40" cy="54" r="13"/>
      <circle cx="40" cy="40" r="6" fill="#E7DBC2"/>
    </g>
    <g transform="translate(80,80)">
      <circle cx="26" cy="40" r="13"/>
      <circle cx="54" cy="40" r="13"/>
      <circle cx="40" cy="26" r="13"/>
      <circle cx="40" cy="54" r="13"/>
      <circle cx="40" cy="40" r="6" fill="#E7DBC2"/>
    </g>

    <!-- Motivo B: flor de cuatro pétalos en rombo (arriba derecha y abajo izquierda) -->
    <g transform="translate(80,0)">
      <path d="M40 16 L52 40 L40 64 L28 40 Z"/>
      <path d="M16 40 L40 28 L64 40 L40 52 Z"/>
      <circle cx="40" cy="40" r="5" fill="#E7DBC2"/>
      <circle cx="40" cy="12" r="3.5"/>
      <circle cx="40" cy="68" r="3.5"/>
      <circle cx="12" cy="40" r="3.5"/>
      <circle cx="68" cy="40" r="3.5"/>
    </g>
    <g transform="translate(0,80)">
      <path d="M40 16 L52 40 L40 64 L28 40 Z"/>
      <path d="M16 40 L40 28 L64 40 L40 52 Z"/>
      <circle cx="40" cy="40" r="5" fill="#E7DBC2"/>
      <circle cx="40" cy="12" r="3.5"/>
      <circle cx="40" cy="68" r="3.5"/>
      <circle cx="12" cy="40" r="3.5"/>
      <circle cx="68" cy="40" r="3.5"/>
    </g>
  </g>
</svg>
