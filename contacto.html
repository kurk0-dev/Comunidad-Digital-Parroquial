<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — G.O. Divino Niño Jesús</title>
  <meta name="description" content="Escríbele al coordinador del Grupo de Oración Divino Niño Jesús por WhatsApp o déjanos un mensaje.">
  <meta name="theme-color" content="#CF040D">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/lexend.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="contacto">

  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div id="cabecera"></div>

  <main id="contenido">
    <section class="seccion">
      <div class="contenedor">
        <p class="seccion__eyebrow">Escríbenos</p>
        <h1 class="seccion__titulo">Contacto</h1>
        <p class="seccion__intro">Elige la vía que te resulte más cómoda.</p>

        <div class="contacto">
          <article class="contacto__tarjeta contacto__tarjeta--destacada">
            <h2 class="subtitulo subtitulo--primero">WhatsApp</h2>
            <p><span id="contactoResponsable"></span><br><span id="contactoHorario"></span></p>
            <a class="boton boton--whatsapp" data-whatsapp="Hola, escribo desde la página del grupo de oración." href="#">Escribir por WhatsApp</a>
          </article>

          <article class="contacto__tarjeta">
            <h2 class="subtitulo subtitulo--primero">Déjanos un mensaje</h2>
            <p>Dudas sobre las reuniones, el seminario, la capilla o cómo participar.</p>
            <a class="boton boton--primario" data-form="contacto" href="#">Abrir formulario</a>
          </article>

          <article class="contacto__tarjeta">
            <h2 class="subtitulo subtitulo--primero">Visítanos</h2>
            <p>Nos reunimos en la Capilla Divino Niño.</p>
            <a class="boton boton--secundario" data-maps href="#">Cómo llegar</a>
          </article>
        </div>

        <p data-privacidad></p>
      </div>
    </section>
  </main>

  <div id="pie"></div>

  <script src="content.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
