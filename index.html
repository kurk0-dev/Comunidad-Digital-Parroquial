<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parroquia San Francisco Javier — Comunidad Digital y Solidaria</title>
  <meta name="description" content="Parroquia San Francisco Javier, Ate, Lima. Diócesis de Chosica. Horarios de misa, servicios parroquiales, catequesis, donaciones y solicitudes de ayuda.">
  <meta name="theme-color" content="#14304D">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="inicio">

  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <!-- La cabecera la genera js/main.js (igual en las 6 páginas) -->
  <div id="cabecera"></div>

  <main id="contenido">

    <!-- ===================== PORTADA CON EL ESCUDO ===================== -->
    <section class="portada">
      <div class="contenedor">
        <div class="portada__logo-caja" id="logoPortada"></div>
        <p class="portada__sobretitulo" id="portadaDistrito"></p>
        <h1 class="portada__titulo" id="portadaMision"></h1>
        <p class="portada__bajada" id="portadaBajada"></p>

        <div class="portada__acciones">
          <a class="boton boton--primario" href="misas.html">Ver horarios de misa</a>
          <a class="boton boton--secundario" href="donaciones.html">Cómo ayudar</a>
        </div>

        <ul class="redes" id="redes" aria-label="Redes sociales"></ul>
      </div>
    </section>

    <!-- ===================== ACCESOS A LAS PESTAÑAS ===================== -->
    <section class="seccion">
      <div class="contenedor">
        <p class="seccion__eyebrow">Qué encuentras aquí</p>
        <h2 class="seccion__titulo">La parroquia en línea</h2>
        <p class="seccion__intro">Cada sección tiene su propia página. Toca la que necesites.</p>
        <div class="accesos" id="accesos"></div>
      </div>
    </section>

    <!-- ====================== SOBRE NOSOTROS ====================== -->
    <section class="seccion">
      <div class="contenedor">
        <p class="seccion__eyebrow">Quiénes somos</p>
        <h2 class="seccion__titulo">Sobre nosotros</h2>

        <div class="nosotros">
          <div class="nosotros__texto">
            <p id="historia"></p>
            <p class="nosotros__direccion" id="direccion"></p>
            <a class="boton boton--secundario" id="enlaceMapa" href="#" target="_blank" rel="noopener">
              Abrir en Google Maps
            </a>
          </div>
          <div class="nosotros__mapa">
            <iframe
              id="mapa"
              title="Mapa de ubicación de la Parroquia San Francisco Javier"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              src=""></iframe>
          </div>
        </div>

        <h3 class="subtitulo">Equipo pastoral</h3>
        <ul class="directiva" id="directiva"></ul>
      </div>
    </section>

  </main>

  <!-- El pie lo genera js/main.js -->
  <div id="pie"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="content.js"></script>
  <script src="js/donaciones.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
