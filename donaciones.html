<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donaciones — Parroquia San Francisco Javier</title>
  <meta name="description" content="Campañas de donación abiertas de la Parroquia San Francisco Javier (Ate, Lima): qué se necesita, cuánto falta para cada meta y dónde entregar.">
  <meta name="theme-color" content="#14304D">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="donaciones">

  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div id="cabecera"></div>

  <main id="contenido">
    <section class="seccion">
      <div class="contenedor">
        <p class="seccion__eyebrow">Solidaridad</p>
        <h1 class="seccion__titulo">Qué necesitamos ahora</h1>
        <p class="seccion__intro">
          Estas son las campañas abiertas y cuánto falta para cada meta.
          <strong>La parroquia no recibe dinero a través de esta página</strong>:
          las donaciones se entregan en persona.
        </p>

        <ul class="campanas" id="campanas"></ul>

        <div class="tarjeta-qr">
          <div class="tarjeta-qr__texto">
            <h3>Punto de entrega</h3>
            <p id="puntoEntrega"></p>
            <p class="tarjeta-qr__nota" id="contactoDonaciones"></p>
            <a class="boton boton--primario" href="contacto.html">Escríbenos antes de venir</a>
          </div>
          <div class="tarjeta-qr__codigo" data-qr="donaciones.html" role="img"
               aria-label="Código QR que abre la página de donaciones"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="pie"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="content.js"></script>
  <script src="js/donaciones.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
